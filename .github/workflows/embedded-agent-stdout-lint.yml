name: Embedded-Agent Stdout Lint

on:
  push:
    branches: [main]
    paths:
      - 'packages/embedded-agent/src/**/*.ts'
      - 'scripts/check-embedded-agent-stdout-writers.mjs'
      - 'scripts/__tests__/check-embedded-agent-stdout-writers.test.mjs'
      - 'scripts/schema-source-normalize.mjs'
      - 'package.json'
      - '.github/workflows/embedded-agent-stdout-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/embedded-agent/src/**/*.ts'
      - 'scripts/check-embedded-agent-stdout-writers.mjs'
      - 'scripts/__tests__/check-embedded-agent-stdout-writers.test.mjs'
      - 'scripts/schema-source-normalize.mjs'
      - 'package.json'
      - '.github/workflows/embedded-agent-stdout-lint.yml'

permissions:
  contents: read

jobs:
  embedded-agent-stdout-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run embedded-agent stdout-writer check
        run: bun run check:embedded-agent-stdout

      - name: Run embedded-agent stdout-writer unit tests
        run: bun test scripts/__tests__/check-embedded-agent-stdout-writers.test.mjs
