name: Structural Metrics

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  check-structure:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Generate TanStack Router files so dep-cruiser can resolve imports.
      - name: Prebuild (generate routeTree.gen.ts)
        run: bun run --filter @agent-console/client build

      - name: Dependency rules (dependency-cruiser, incl. circular)
        run: bun run lint:deps

      - name: Dead code / unused deps (knip)
        run: bun run lint:unused
