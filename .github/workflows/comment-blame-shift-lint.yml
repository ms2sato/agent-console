name: Comment Blame-Shift Lint

on:
  push:
    branches: [main]
    paths:
      - 'packages/*/src/**/*.ts'
      - 'packages/*/src/**/*.tsx'
      - 'packages/*/src/**/*.js'
      - 'packages/*/src/**/*.jsx'
      - 'scripts/**/*.ts'
      - 'scripts/**/*.tsx'
      - 'scripts/**/*.js'
      - 'scripts/**/*.mjs'
      - '.claude/**/*.ts'
      - '.claude/**/*.tsx'
      - '.claude/**/*.js'
      - '.claude/**/*.mjs'
      - 'package.json'
      - '.github/workflows/comment-blame-shift-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/*/src/**/*.ts'
      - 'packages/*/src/**/*.tsx'
      - 'packages/*/src/**/*.js'
      - 'packages/*/src/**/*.jsx'
      - 'scripts/**/*.ts'
      - 'scripts/**/*.tsx'
      - 'scripts/**/*.js'
      - 'scripts/**/*.mjs'
      - '.claude/**/*.ts'
      - '.claude/**/*.tsx'
      - '.claude/**/*.js'
      - '.claude/**/*.mjs'
      - 'package.json'
      - '.github/workflows/comment-blame-shift-lint.yml'

permissions:
  contents: read

jobs:
  comment-blame-shift-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Run comment blame-shift check
        run: bun scripts/check-source-comment-blame-shift.mjs

      - name: Run comment blame-shift unit tests
        run: bun test scripts/__tests__/check-source-comment-blame-shift.test.mjs
