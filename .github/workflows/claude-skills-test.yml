name: Claude Skills Test

# ci.yml's `test` job has `.claude/**` under `paths-ignore`, so a PR that
# changes only files under `.claude/` runs no test job at all -- including
# .claude/skills/orchestrator/__tests__/, where the tests for
# check-utils.js, preflight-check.js, and acceptance-check.js live (the
# scripts that enforce the sibling-test coverage gate itself). This
# workflow closes that gap for .claude/skills/** and .claude/hooks/** --
# the two directories under .claude/ that carry executable code with their
# own test suite -- without touching ci.yml's existing trigger (Issue
# #1471).
#
# `paths-ignore` has no negation, so narrowing it to carve out
# .claude/skills/** would require mixing negative patterns into `paths:`,
# which is order-dependent and a larger drift surface than a small,
# separate workflow. This mirrors the existing targeted-workflow shape
# already used here for language-lint.yml and check-mirror-drift.yml.

on:
  push:
    branches: [main]
    paths:
      - '.claude/skills/**'
      - '.claude/hooks/**'
      - '.github/workflows/claude-skills-test.yml'
  pull_request:
    branches: [main]
    paths:
      - '.claude/skills/**'
      - '.claude/hooks/**'
      - '.github/workflows/claude-skills-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same command a developer runs locally -- no CI-only variant
      # (workflow.md, "CI Must Mirror Local Commands").
      - name: Run scripts/skills tests
        run: bun run test:scripts
