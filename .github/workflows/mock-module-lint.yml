name: Mock Module Lint

on:
  push:
    branches: [main]
    paths:
      - 'packages/*/src/**/*.ts'
      - 'packages/*/src/**/*.tsx'
      - 'scripts/check-mock-module-poisoners.mjs'
      - 'scripts/__tests__/check-mock-module-poisoners.test.mjs'
      - 'package.json'
      - '.github/workflows/mock-module-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/*/src/**/*.ts'
      - 'packages/*/src/**/*.tsx'
      - 'scripts/check-mock-module-poisoners.mjs'
      - 'scripts/__tests__/check-mock-module-poisoners.test.mjs'
      - 'package.json'
      - '.github/workflows/mock-module-lint.yml'

permissions:
  contents: read

jobs:
  mock-module-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run mock-module check
        run: bun run check:mock-module

      - name: Run mock-module unit tests
        run: bun test scripts/__tests__/check-mock-module-poisoners.test.mjs
