name: Debug 1225 open() probe (temporary)

on:
  push:
    branches: [fix/1225-ci-main-red-openpath]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Show runner image info
        run: |
          cat /etc/os-release || true
          echo "IMAGE_VERSION=$ImageVersion"
          echo "IMAGE_OS=$ImageOS"
          bun --version

      - name: Install dependencies
        run: bun install

      - name: Run open() probe
        run: bun scripts/debug-1225-open-probe.mjs
