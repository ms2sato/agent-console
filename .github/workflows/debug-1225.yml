name: Debug 1225 open() probe (temporary)

on:
  push:
    branches: [fix/1225-ci-main-red-openpath]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Show runner image info
        run: |
          cat /etc/os-release || true
          echo "IMAGE_VERSION=$ImageVersion"
          echo "IMAGE_OS=$ImageOS"
          bun --version

      - name: Install dependencies
        run: bun install

      - name: Build shared package
        run: bun run --filter @agent-console/shared build

      - name: Run standalone open() probe
        run: bun scripts/debug-1225-open-probe.mjs

      - name: Show packages/integration/src readdir order
        run: ls -U packages/integration/src/

      - name: Experiment 1 -- probe under bun:test + preload (isolated file)
        working-directory: packages/integration
        run: bun test --preload ./src/setup.ts src/__debug-1225-open-probe.test.ts
        continue-on-error: true

      - name: Experiment 2 -- failing file alone under bun:test + preload
        working-directory: packages/integration
        run: bun test --preload ./src/setup.ts src/system-api-boundary.test.ts
        continue-on-error: true

      - name: Experiment 3 -- full integration suite (baseline reproduction)
        working-directory: packages/integration
        run: bun test --preload ./src/setup.ts src/
        continue-on-error: true
