name: Language Lint

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - 'CLAUDE.md'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/language-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - 'CLAUDE.md'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/language-lint.yml'

permissions:
  contents: read

jobs:
  language-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run language check
        run: bun run check:lang

      - name: Run doc fragment check
        run: bun run check:doc-fragments

      - name: Run glossary term check
        run: bun run check:glossary-terms

      - name: Run language-check unit tests
        run: bun run test:scripts
