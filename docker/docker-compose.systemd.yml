# Tier-3 verification stack: systemd as PID 1 (docker/Dockerfile.systemd).
#
# Driven ONLY by scripts/verify-multiuser-systemd.sh, on an ephemeral GitHub
# runner (or a personal workstation whose only user is its owner). NEVER on
# the dogfood host -- see docs/design/elevation-verification-tiers.md, "The
# rule: never on the dogfood host". The driver refuses unless
# AC_TIER3_RUNNER=github-hosted (the workflow copies GitHub's own
# `runner.environment` context there) or AC_TIER3_HOST_OK=1 (the explicit
# workstation opt-in) is set; a bare CI=true is not accepted. That gate stops
# AMBIENT runs on the wrong host (a delegate typing the command, an inherited
# variable); it does not stop a workflow author who edits the env to the
# literal marker -- an org-level runner-registration concern, not a
# shell-enforceable security boundary. Do not `docker compose up` this file
# by hand.
#
# The service block below is the boot set measured in Task 0 (runner only):
#   CAP_SYS_ADMIN + host cgroup namespace + rw /sys/fs/cgroup bind
#   + tmpfs /run,/run/lock + container=docker + apparmor=unconfined,
#   seccomp = Docker's default profile, no --privileged. SYS_ADMIN is the
#   only capability ADDED; `cap_add` keeps Docker's default capability set,
#   which the measurement ran with (no `cap_drop: ALL` -- narrowing the
#   defaults would be a new boot measurement, not a comment change).
# Task 0 measured that the same set WITHOUT the AppArmor opt-out does not
# boot on ubuntu-latest (systemd 255 exits 255: "Failed to fork off
# sandboxing environment for executing generators: Protocol error"), and that
# --privileged was never needed. Do not "simplify" this to --privileged; if
# the set stops booting, the driver stops and reports the console text.
#
# Explicit project name so this stack's resources never collide with the
# tier-2 stacks' (docker-compose.yml / docker-compose.verification.yml share
# this directory, whose basename would otherwise be the default project name).
name: agent-console-systemd
services:
  systemd:
    build:
      # docker/ is the whole build context (the checkout is bind-mounted at
      # run time, see volumes), so an image rebuild only re-reads this dir.
      context: .
      dockerfile: Dockerfile.systemd
    image: agent-console-systemd-verify
    container_name: agent-console-systemd-verify
    # A tty is what makes systemd's /dev/console output land in `docker
    # logs`; without it a failed early boot leaves the log EMPTY (Task 0 run 1
    # measured that; run 2 captured the console text only because of -t).
    tty: true
    cap_add:
      - SYS_ADMIN
    cgroup: host
    security_opt:
      - apparmor=unconfined
    tmpfs:
      - /run
      - /run/lock
    environment:
      container: docker
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # The runner's checkout, read-only. The setup script rsyncs from here
      # (--repo-source /src) and the driver copies it into the shared
      # source-repos dir as the service user (cp -a; a git clone from a
      # runner-owned bind mount hits "dubious ownership").
      - ..:/src:ro
    # No host ports: every probe (curl, systemctl, the smokes) runs inside the
    # container via `docker compose exec`.
    # systemd's clean-shutdown signal (also the Dockerfile's STOPSIGNAL);
    # 20 s lets the deployed unit stop before PID 1 exits.
    stop_signal: SIGRTMIN+3
    stop_grace_period: 20s
