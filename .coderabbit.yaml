# CodeRabbit repository configuration.
#
# NOTE: this file takes precedence over the CodeRabbit web-UI settings for
# this repository. Settings previously configured in the UI must be carried
# over here explicitly (currently: review profile "chill").
#
# Why this file exists: docs-only PRs (spec-sync, glossary, rules) were
# consuming the org's auto-review quota and rate-limiting code PRs during
# PR-dense sprints. PRs titled with a conventional docs prefix skip
# auto-review; a manual `@coderabbitai review` comment still triggers a
# review on demand. Deliberately NOT excluding `**/*.md` via path_filters —
# spec updates that ride along in code PRs must stay in review context.
#
# Both title forms are listed because `ignore_title_keywords` is a
# case-insensitive SUBSTRING match, not a prefix match. "docs:" alone never
# fired for this repository: every docs PR here is titled with a scope
# (`docs(orchestrator):`, `docs(coderabbit-ops):`), and none of those
# contains the substring "docs:". See Issue #1440.
#
# The unscoped keyword "docs" is deliberately NOT used: substring matching
# would also skip code PRs whose title merely mentions the word. Measured
# over this repository's 600 most recent PR titles, "docs" alone would have
# silently skipped three production PRs (#688, #1014, #1360), while the two
# literals below matched only real docs PRs (12/12 for "docs(", and every
# "docs:" hit was a docs PR). Losing review coverage on a code PR is the
# expensive direction of error, so the keywords stay narrow.
language: en-US
reviews:
  profile: chill
  auto_review:
    enabled: true
    ignore_title_keywords:
      - "docs:"
      - "docs("
